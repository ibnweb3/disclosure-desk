<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 720" preserveAspectRatio="xMidYMax slice" role="presentation" aria-hidden="true">
  <defs>
    <linearGradient id="ln" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7dd3fc" stop-opacity="0"/>
      <stop offset=".38" stop-color="#7dd3fc" stop-opacity=".28"/>
      <stop offset=".62" stop-color="#99f6e4" stop-opacity=".85"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity=".95"/>
    </linearGradient>
    <linearGradient id="area" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".12"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-5%" y="-30%" width="110%" height="160%"><feGaussianBlur stdDeviation="5"/></filter>
  </defs>

  <!-- faint chart grid -->
  <g stroke="#fff" stroke-opacity=".08" stroke-width="1">
    <line x1="0" y1="400" x2="1600" y2="400"/><line x1="0" y1="470" x2="1600" y2="470"/>
    <line x1="0" y1="540" x2="1600" y2="540"/><line x1="0" y1="610" x2="1600" y2="610"/>
  </g>

  <!-- the price line: the news arrives late, the move has already started -->
  <path d="M0,560 L120,540 L230,578 L340,500 L450,520 L560,446 L660,470 L770,404 L880,432 L990,350 L1100,380 L1210,308 L1330,338 L1450,254 L1600,212 L1600,720 L0,720 Z" fill="url(#area)"/>
  <path d="M0,560 L120,540 L230,578 L340,500 L450,520 L560,446 L660,470 L770,404 L880,432 L990,350 L1100,380 L1210,308 L1330,338 L1450,254 L1600,212" fill="none" stroke="url(#ln)" stroke-width="7" stroke-linejoin="round" stroke-linecap="round" filter="url(#glow)" opacity=".7"/>
  <path d="M0,560 L120,540 L230,578 L340,500 L450,520 L560,446 L660,470 L770,404 L880,432 L990,350 L1100,380 L1210,308 L1330,338 L1450,254 L1600,212" fill="none" stroke="url(#ln)" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
  <g fill="#fff" fill-opacity=".85">
    <circle cx="560" cy="446" r="5"/><circle cx="990" cy="350" r="5"/><circle cx="1450" cy="254" r="6"/>
  </g>
</svg>
