<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 720" preserveAspectRatio="xMidYMax slice" role="presentation" aria-hidden="true">
  <defs>
    <linearGradient id="ln" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7dd3fc" stop-opacity="0"/>
      <stop offset=".38" stop-color="#7dd3fc" stop-opacity=".28"/>
      <stop offset=".62" stop-color="#99f6e4" stop-opacity=".85"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity=".95"/>
    </linearGradient>
    <linearGradient id="area" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".13"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-5%" y="-30%" width="110%" height="160%"><feGaussianBlur stdDeviation="5"/></filter>
  </defs>

  <!-- soft rings, as on a trading-site hero -->
  <circle cx="1380" cy="110" r="430" fill="none" stroke="#fff" stroke-opacity=".06" stroke-width="2"/>
  <circle cx="1380" cy="110" r="300" fill="none" stroke="#fff" stroke-opacity=".05" stroke-width="2"/>
  <circle cx="140" cy="720" r="520" fill="#fff" fill-opacity=".035"/>

  <!-- chart grid -->
  <g stroke="#fff" stroke-opacity=".07" stroke-width="1">
    <line x1="0" y1="330" x2="1600" y2="330"/><line x1="0" y1="400" x2="1600" y2="400"/>
    <line x1="0" y1="470" x2="1600" y2="470"/><line x1="0" y1="540" x2="1600" y2="540"/>
    <line x1="0" y1="610" x2="1600" y2="610"/>
  </g>

  <!-- the Capitol, as a quiet silhouette -->
  <g transform="translate(800 720)" fill="#fff" fill-opacity=".10">
