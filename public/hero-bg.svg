    <rect x="-450" y="-112" width="340" height="96"/>
    <rect x="110" y="-112" width="340" height="96"/>
    <rect x="-450" y="-128" width="340" height="16"/>
    <rect x="110" y="-128" width="340" height="16"/>
    <rect x="-135" y="-190" width="270" height="174"/>
    <polygon points="-135,-190 0,-238 135,-190"/>
    <rect x="-98" y="-268" width="196" height="80"/>
    <path d="M-98,-268 C-98,-362 -52,-420 0,-432 C52,-420 98,-362 98,-268 Z"/>
    <rect x="-32" y="-470" width="64" height="40"/>
    <path d="M-32,-470 C-32,-494 -13,-506 0,-510 C13,-506 32,-494 32,-470 Z"/>
    <rect x="-3" y="-540" width="6" height="32"/>
    <circle cx="0" cy="-546" r="6"/>
  </g>
  <g transform="translate(800 720)" stroke="#fff" stroke-opacity=".09" stroke-width="6" fill="none">
    <path d="M-430,-104V-22M-396,-104V-22M-362,-104V-22M-328,-104V-22M-294,-104V-22M-260,-104V-22M-226,-104V-22M-192,-104V-22M-158,-104V-22M-124,-104V-22"/>
    <path d="M430,-104V-22M396,-104V-22M362,-104V-22M328,-104V-22M294,-104V-22M260,-104V-22M226,-104V-22M192,-104V-22M158,-104V-22M124,-104V-22"/>
    <path d="M-112,-182V-22M-76,-182V-22M-40,-182V-22M-4,-182V-22M32,-182V-22M68,-182V-22M104,-182V-22"/>
    <path d="M-80,-262V-196M-48,-262V-196M-16,-262V-196M16,-262V-196M48,-262V-196M80,-262V-196"/>
  </g>
  <g transform="translate(800 720)" stroke="#fff" stroke-opacity=".07" stroke-width="3" fill="none">
    <path d="M-62,-268 C-56,-340 -26,-402 0,-430"/><path d="M62,-268 C56,-340 26,-402 0,-430"/>
    <path d="M-30,-268 C-26,-350 -10,-410 0,-430"/><path d="M30,-268 C26,-350 10,-410 0,-430"/>
